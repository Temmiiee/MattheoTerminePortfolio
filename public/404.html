<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page introuvable (404) - Matthéo Termine</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root {
    --bg: #fafaf9;
    --text: #1c1917;
    --text-secondary: #57534e;
    --border: #d6d3d1;
    --accent: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09;
      --text: #fafaf9;
      --text-secondary: #d6d3d1;
      --border: #44403c;
      --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    line-height: 1.6;
    text-align: center;
    padding: 2rem;
  }
  .wrap { max-width: 480px; }
  .code {
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 1rem;
  }
  h1 { font-size: 1.9rem; margin: 0 0 1rem; }
  p { color: var(--text-secondary); margin-bottom: 2rem; }
  a.btn {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">ERREUR 404</p>
    <h1>Cette page n'existe pas</h1>
    <p>La page que vous cherchez a peut-être été déplacée ou n'existe plus.</p>
    <a class="btn" href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
